<html>
    <head>
        <title>Onboarding Page</title>
        <nav id="main-nav">
        <a href="login.html">Login</a>
        <a href="directory.html">Directory</a>
        <a href="onboarding.html">Onboarding</a>
        </nav>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="pageid">
            <h2 id="headid">Onboarding Form</h2>
            <form id="formid">
                <div class="formclass">
                    <label>Full name</label>
                    <input type="text" placeholder="enter full name"  class="inputclass">
                </div>
                <div class="formclass">
                    <label>Official email</label>
                    <input type="email" placeholder="enter your official email"  class="inputclass">
                </div>
                <div class="formclass">
                    <label>Temporary password</label>
                    <input type="password" placeholder="enter password"  class="inputclass">
                </div>
                <div class="formclass">
                    <label>Date of birth</label>
                    <input type="date" placeholder="enter date of birth"  class="inputclass">
                </div>
                <div class="formclass">
                    <label>Joining date</label>
                    <input type="date" placeholder="enter your joining date"  class="inputclass">
                </div>
                <div class="formclass">
                    <label>Orientation slot</label>
                    <input type="datetime-local" placeholder="enter your Orientation slot"  class="inputclass">
                </div>
                <div class="formclass">
                    <label>Reporting time on day one</label>
                    <input type="time" placeholder="enter your reporting time on day one"  class="inputclass">
                </div>
                <div class="formclass">
                    <label>Gender</label>
                    
                    <label><input type="radio" name="gender" value="male">Male</label>
                    <label><input type="radio" name="gender" value="female">Female</label>
                    <label><input type="radio" name="gender" value="others">Others</label>
                </div>
        
                <div class="formclass">
                    <label>Highest qualification</label>
                    <select>
                        <option>10</option>
                        <option>12</option>
                        <option>Graduation</option>
                        <option>Post Graduation</option>
                    </select>
                </div>
                <div class="formclass">
                    <label>Department</label>
                    <select>
                        <option>IT</option>
                        <option>CS</option>
                        <option>Civil</option>
                        <option>Sales</option>
                        <option>Mechanical</option>
                    </select>
                </div>
                <div class="formclass">
                    <label>Current address</label>
                    <textarea placeholder="enter current address"  class="inputclass"></textarea>
                </div>
                <div class="formclass">
                    <label>Passport Photo</label>
                    <input type="file">
                </div>
                <div class="formclass">
                    <label>Resume</label>
                    <input type="file">
                </div>
                <div class="formclass">
                    <!-- <label>Declaration</label> -->
                    <label>Accept terms and conditions<input type="checkbox"></label>
                </div>
                <div class="formclass btnrow" style="margin:auto;">
                    <button type="submit" class="buttonclass">Submit</button>
                    <button type="reset" class="buttonclass">Reset</button>
                    <button type="button" class="buttonclass">Need help?</button>
                </div>
            </form>
            <div id="mapid">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7722824.148337995!2d68.510475025!3d19.067684200000006!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be7c788688f8aed%3A0xec6febe2bd5935!2sTechNova%20Imaging%20Systems%20(P)%20Limited!5e0!3m2!1sen!2sin!4v1792841507202!5m2!1sen!2sin" width="500" height="350" style="border:1px solid;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            
        </div>

    </body>
</html>
